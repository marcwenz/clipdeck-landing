<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <pattern id="ticks-major" x="0" y="0" width="200" height="14" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <pattern id="ticks-minor" x="0" y="0" width="40" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-width="0.6"/>
