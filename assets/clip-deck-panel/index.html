<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Deck</title>
<!--
  Removed Google Fonts <link> on purpose — it's render-blocking and
  fetches over the network on every cold start. The CSS already uses
  the system stack ("-apple-system, BlinkMacSystemFont, \"Inter\", …")
  so macOS falls back to San Francisco cleanly. If we want Inter
  again later, bundle the .woff2 locally instead of going to
  fonts.googleapis.com.
-->
<link rel="stylesheet" href="renderer/styles.css">
<!-- DEMO (landing-page panel): hides Pro/Free badges + paywall CTAs. Loaded last so it wins. -->
<link rel="stylesheet" href="renderer/demo.css">
</head>
<body>
<div id="root"></div>

<!--
  DEMO (landing-page panel): these two MUST load before everything else so
  window.clipDeck + window.__CLIPDECK_DEMO_CONFIG exist before store.js and
  app.jsx read them. demo-config.js = baked, privacy-scrubbed library;
  demo-bridge.js = fake Electron preload bridge (sets window.CLIPDECK_DEMO).
-->
<script src="renderer/demo-config.js"></script>
<script src="renderer/demo-bridge.js"></script>

<script src="renderer/client.js"></script>
<script src="renderer/store.js"></script>

<!--
  React + Babel are served from the bundled vendor/ directory instead
  of unpkg.com. Loading from a CDN on every launch was costing 1–3
  seconds of cold-start time (3 MB Babel + network roundtrips) and
  was the dominant lag source after install / on launch.
-->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>

<script type="text/babel" data-presets="react" src="renderer/license.jsx"></script>
<script type="text/babel" data-presets="react" src="renderer/paywall.jsx"></script>
<script type="text/babel" data-presets="react" src="renderer/cgfy.jsx"></script>
<script type="text/babel" data-presets="react" src="renderer/app.jsx"></script>
</body>
</html>
